version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: raad_postgres
    environment:
      POSTGRES_DB: raad_db
      POSTGRES_USER: raad_user
      POSTGRES_PASSWORD: raad_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: raad_redis
    ports:
      - "6379:6379"

volumes:
  postgres_data: 
