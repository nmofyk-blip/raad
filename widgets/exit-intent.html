<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>رعد - نافذة الخروج</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #f5f5f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .page-content {
      text-align: center;
      color: #666;
      font-size: 18px;
    }

    /* الخلفية المعتمة */
    .overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(4px);
      z-index: 9998;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s;
    }

    .overlay.show {
      opacity: 1;
      visibility: visible;
    }

    /* النافذة */
    .exit-popup {
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%) scale(0.8);
      background: white;
      border-radius: 24px;
      padding: 40px;
      max-width: 460px;
      width: 90%;
      z-index: 9999;
      text-align: center;
      opacity: 0;
      visibility: hidden;
      transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
      box-shadow: 0 30px 80px rgba(0,0,0,0.3);
    }

    .exit-popup.show {
      opacity: 1;
      visibility: visible;
      transform: translate(-50%, -50%) scale(1);
    }

    .popup-emoji {
      font-size: 60px;
      margin-bottom: 16px;
      display: block;
      animation: bounce 1s ease infinite;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    .popup-title {
      font-size: 26px;
      font-weight: 800;
      color: #1a1a2e;
      margin-bottom: 8px;
    }

    .popup-subtitle {
      font-size: 15px;
      color: #888;
      margin-bottom: 24px;
      line-height: 1.6;
    }

    .coupon-box {
      background: linear-gradient(135deg, #fff5f0, #fff0e8);
      border: 2px dashed #ff6b35;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 24px;
    }

    .coupon-label {
      font-size: 13px;
      color: #888;
      margin-bottom: 8px;
    }

    .coupon-code {
      font-size: 32px;
      font-weight: 800;
      color: #ff6b35;
      letter-spacing: 4px;
    }

    .coupon-value {
      font-size: 14px;
      color: #666;
      margin-top: 6px;
    }

    .coupon-value strong {
      color: #e74c3c;
    }

    .timer-small {
      font-size: 13px;
      color: #e74c3c;
      font-weight: 600;
      margin-bottom: 20px;
    }

    .accept-btn {
      background: linear-gradient(135deg, #ff6b35, #f7931e);
      color: white;
      border: none;
      border-radius: 50px;
      padding: 16px 32px;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
      margin-bottom: 12px;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .accept-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(255,107,53,0.4);
    }

    .decline-btn {
      background: none;
      border: none;
      color: #bbb;
      font-size: 13px;
      cursor: pointer;
      text-decoration: underline;
    }

    .decline-btn:hover {
      color: #999;
    }

    .close-popup {
      position: absolute;
      top: 16px;
      left: 16px;
      background: #f0f0f0;
      border: none;
      border-radius: 50%;
      width: 32px;
      height: 32px;
      cursor: pointer;
      font-size: 16px;
      color: #999;
    }

    .close-popup:hover {
      background: #e0e0e0;
    }
  </style>
</head>
<body>

  <div class="page-content">
    🖱️ حرّك الماوس نحو أعلى الصفحة لتظهر النافذة
  </div>

  <div class="overlay" id="overlay" onclick="closePopup()"></div>

  <div class="exit-popup" id="exitPopup">
    <button class="close-popup" onclick="closePopup()">✕</button>
    
    <span class="popup-emoji">🎁</span>
    <div class="popup-title">لحظة قبل ما تغادر!</div>
    <div class="popup-subtitle">
      لديك منتجات في سلتك — خذ هذا الكوبون الحصري كهدية منا
    </div>

    <div class="coupon-box">
      <div class="coupon-label">كوبون الخصم الخاص بك</div>
      <div class="coupon-code" id="couponCode">RAAD10</div>
      <div class="coupon-value">خصم <strong>10%</strong> على طلبك كاملاً</div>
    </div>

    <div class="timer-small" id="timerSmall">⏰ ينتهي الكوبون بعد: 10:00 دقائق</div>

    <button class="accept-btn" onclick="acceptOffer()">
      🛍️ استخدم الكوبون الآن
    </button>
    <button class="decline-btn" onclick="closePopup()">
      لا شكراً، سأدفع السعر الكامل
    </button>
  </div>

  <script>
    let shown = false;
    let seconds = 600;

    // كشف نية الخروج
    document.addEventListener('mouseleave', (e) => {
      if (e.clientY <= 0 && !shown) {
        showPopup();
      }
    });

    function showPopup() {
      shown = true;
      document.getElementById('overlay').classList.add('show');
      document.getElementById('exitPopup').classList.add('show');
      startTimer();
    }

    function closePopup() {
      document.getElementById('overlay').classList.remove('show');
      document.getElementById('exitPopup').classList.remove('show');
    }

    function acceptOffer() {
      const code = document.getElementById('couponCode').textContent;
      navigator.clipboard.writeText(code).then(() => {
        alert(`✅ تم نسخ الكوبون: ${code}\nاستخدمه عند الدفع!`);
      });
      closePopup();
    }

    function startTimer() {
      const interval = setInterval(() => {
        seconds--;
        const m = Math.floor(seconds / 60);
        const s = seconds % 60;
        document.getElementById('timerSmall').textContent = 
          `⏰ ينتهي الكوبون بعد: ${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')} دقائق`;
        
        if (seconds <= 0) {
          clearInterval(interval);
          closePopup();
        }
      }, 1000);
    }
  </script>

</body>
</html>
