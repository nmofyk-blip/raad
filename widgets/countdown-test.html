 <!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>رعد - عداد العروض</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .raad-countdown {
      background: linear-gradient(135deg, #1a1a2e, #16213e);
      border-radius: 16px;
      padding: 24px 32px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      max-width: 400px;
      width: 90%;
      border: 1px solid rgba(255,255,255,0.1);
    }

    .raad-countdown .title {
      color: #ff6b35;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .raad-countdown .offer-text {
      color: #ffffff;
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 20px;
    }

    .raad-countdown .offer-text span {
      color: #ff6b35;
    }

    .timer {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    .timer-block {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,107,53,0.3);
      border-radius: 12px;
      padding: 12px 16px;
      min-width: 70px;
    }

    .timer-block .number {
      color: #ff6b35;
      font-size: 32px;
      font-weight: 800;
      line-height: 1;
      display: block;
    }

    .timer-block .label {
      color: rgba(255,255,255,0.5);
      font-size: 11px;
      margin-top: 4px;
      display: block;
    }

    .timer-separator {
      color: #ff6b35;
      font-size: 28px;
      font-weight: 800;
      align-self: center;
      margin-bottom: 20px;
    }

    .cta-button {
      background: linear-gradient(135deg, #ff6b35, #f7931e);
      color: white;
      border: none;
      border-radius: 50px;
      padding: 14px 32px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .cta-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(255,107,53,0.4);
    }

    .urgency-text {
      color: rgba(255,255,255,0.4);
      font-size: 12px;
      margin-top: 12px;
    }
  </style>
</head>
<body>

  <div class="raad-countdown">
    <div class="title">🔥 عرض محدود</div>
    <div class="offer-text">احصل على خصم <span>20%</span> الآن!</div>
    
    <div class="timer">
      <div class="timer-block">
        <span class="number" id="hours">00</span>
        <span class="label">ساعة</span>
      </div>
      <div class="timer-separator">:</div>
      <div class="timer-block">
        <span class="number" id="minutes">00</span>
        <span class="label">دقيقة</span>
      </div>
      <div class="timer-separator">:</div>
      <div class="timer-block">
        <span class="number" id="seconds">00</span>
        <span class="label">ثانية</span>
      </div>
    </div>

    <button class="cta-button">🛍️ اشترِ الآن قبل انتهاء العرض</button>
    <div class="urgency-text">⚡ السعر يرتفع بعد انتهاء العداد</div>
  </div>

  <script>
    // مدة العرض — 2 ساعة من الآن
    const duration = 2 * 60 * 60;
    let remaining = duration;

    function update() {
      const h = Math.floor(remaining / 3600);
      const m = Math.floor((remaining % 3600) / 60);
      const s = remaining % 60;

      document.getElementById('hours').textContent = String(h).padStart(2, '0');
      document.getElementById('minutes').textContent = String(m).padStart(2, '0');
      document.getElementById('seconds').textContent = String(s).padStart(2, '0');

      if (remaining > 0) {
        remaining--;
        setTimeout(update, 1000);
      } else {
        document.querySelector('.cta-button').textContent = '❌ انتهى العرض';
        document.querySelector('.cta-button').style.background = '#666';
      }
    }

    update();
  </script>

</body>
</html>
