<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>رعد - شريط الإعلانات</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #f5f5f5;
    }

    .announcement-bar {
      background: linear-gradient(135deg, #1a1a2e, #16213e);
      color: white;
      padding: 12px 20px;
      text-align: center;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      overflow: hidden;
    }

    .bar-messages {
      display: flex;
      align-items: center;
      gap: 8px;
      animation: none;
    }

    .bar-message {
      display: none;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      font-weight: 500;
    }

    .bar-message.active {
      display: flex;
    }

    .bar-message .icon {
      font-size: 18px;
    }

    .bar-message .text {
      color: rgba(255,255,255,0.9);
    }

    .bar-message .highlight {
      color: #ff6b35;
      font-weight: 700;
    }

    .bar-dots {
      display: flex;
      gap: 6px;
      position: absolute;
      left: 50%;
      bottom: 4px;
      transform: translateX(-50%);
    }

    .dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: rgba(255,255,255,0.3);
      cursor: pointer;
      transition: all 0.3s;
    }

    .dot.active {
      background: #ff6b35;
      width: 16px;
      border-radius: 3px;
    }

    .bar-close {
      position: absolute;
      left: 16px;
      background: none;
      border: none;
      color: rgba(255,255,255,0.5);
      cursor: pointer;
      font-size: 18px;
      padding: 4px;
      transition: color 0.2s;
    }

    .bar-close:hover {
      color: white;
    }

    .bar-cta {
      background: #ff6b35;
      color: white;
      border: none;
      border-radius: 20px;
      padding: 4px 14px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .bar-cta:hover {
      background: #f7931e;
      transform: scale(1.05);
    }

    /* محتوى الصفحة */
    .page-demo {
      padding: 40px;
      text-align: center;
    }

    .demo-title {
      font-size: 24px;
      font-weight: 700;
      color: #1a1a2e;
      margin-bottom: 12px;
    }

    .demo-subtitle {
      color: #888;
      font-size: 15px;
    }

    /* أنواع الشريط */
    .bar-types {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 32px;
    }

    .bar-type-btn {
      padding: 10px 20px;
      border-radius: 50px;
      border: 2px solid #e0e0e0;
      background: white;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      color: #666;
      transition: all 0.2s;
    }

    .bar-type-btn:hover, .bar-type-btn.active {
      border-color: #ff6b35;
      color: #ff6b35;
      background: #fff5f0;
    }

    /* ألوان مختلفة للشريط */
    .announcement-bar.green {
      background: linear-gradient(135deg, #1a472a, #2d6a4f);
    }

    .announcement-bar.purple {
      background: linear-gradient(135deg, #4a0072, #6a0dad);
    }

    .announcement-bar.red {
      background: linear-gradient(135deg, #c0392b, #e74c3c);
    }
  </style>
</head>
<body>

  <div class="announcement-bar" id="announcementBar">
    <button class="bar-close" onclick="closeBar()">✕</button>
    
    <div class="bar-messages">
      <div class="bar-message active" id="msg0">
        <span class="icon">🚚</span>
        <span class="text">توصيل <span class="highlight">مجاني</span> للطلبات فوق 200 ريال</span>
        <button class="bar-cta">تسوق الآن</button>
      </div>
      <div class="bar-message" id="msg1">
        <span class="icon">🔥</span>
        <span class="text">عرض اليوم فقط — خصم <span class="highlight">30%</span> على كل المنتجات</span>
        <button class="bar-cta">اكتشف العروض</button>
      </div>
      <div class="bar-message" id="msg2">
        <span class="icon">🎁</span>
        <span class="text">استخدم كود <span class="highlight">RAAD20</span> واحصل على خصم 20%</span>
        <button class="bar-cta">انسخ الكود</button>
      </div>
    </div>

    <div class="bar-dots">
      <div class="dot active" onclick="goTo(0)"></div>
      <div class="dot" onclick="goTo(1)"></div>
      <div class="dot" onclick="goTo(2)"></div>
    </div>
  </div>

  <div class="page-demo">
    <div class="demo-title">🌩️ رعد — شريط الإعلانات</div>
    <div class="demo-subtitle">يتبدل تلقائياً ويدعم أكثر من رسالة</div>

    <div class="bar-types">
      <button class="bar-type-btn active" onclick="changeColor('')">🌙 داكن</button>
      <button class="bar-type-btn" onclick="changeColor('green')">💚 أخضر</button>
      <button class="bar-type-btn" onclick="changeColor('purple')">💜 بنفسجي</button>
      <button class="bar-type-btn" onclick="changeColor('red')">❤️ أحمر</button>
    </div>
  </div>

  <script>
    let current = 0;
    const total = 3;

    function goTo(index) {
      document.getElementById(`msg${current}`).classList.remove('active');
      document.querySelectorAll('.dot')[current].classList.remove('active');
      current = index;
      document.getElementById(`msg${current}`).classList.add('active');
      document.querySelectorAll('.dot')[current].classList.add('active');
    }

    // تبديل تلقائي كل 4 ثواني
    setInterval(() => {
      goTo((current + 1) % total);
    }, 4000);

    function closeBar() {
      document.getElementById('announcementBar').style.display = 'none';
    }

    function changeColor(color) {
      const bar = document.getElementById('announcementBar');
      bar.className = 'announcement-bar ' + color;
      document.querySelectorAll('.bar-type-btn').forEach(b => b.classList.remove('active'));
      event.target.classList.add('active');
    }
  </script>

</body>
</html>
