 <!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>رعد - عداد المخزون</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .product-card {
      background: white;
      border-radius: 20px;
      padding: 32px;
      max-width: 380px;
      width: 90%;
      box-shadow: 0 10px 40px rgba(0,0,0,0.1);
    }

    .product-image {
      background: linear-gradient(135deg, #f5f5f5, #e0e0e0);
      border-radius: 16px;
      height: 200px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 80px;
      margin-bottom: 20px;
    }

    .product-name {
      font-size: 20px;
      font-weight: 700;
      color: #1a1a2e;
      margin-bottom: 8px;
    }

    .product-price {
      font-size: 28px;
      font-weight: 800;
      color: #ff6b35;
      margin-bottom: 20px;
    }

    .product-price span {
      font-size: 16px;
      color: #999;
      text-decoration: line-through;
      margin-right: 8px;
    }

    /* عداد المخزون */
    .stock-widget {
      background: linear-gradient(135deg, #fff5f0, #fff0e8);
      border: 1px solid #ffcdb0;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 20px;
    }

    .stock-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .stock-label {
      font-size: 13px;
      font-weight: 700;
      color: #e74c3c;
    }

    .stock-count {
      font-size: 13px;
      color: #666;
    }

    .stock-count strong {
      color: #e74c3c;
      font-size: 16px;
    }

    .stock-bar {
      background: #f0f0f0;
      border-radius: 50px;
      height: 8px;
      overflow: hidden;
      margin-bottom: 10px;
    }

    .stock-fill {
      background: linear-gradient(90deg, #ff6b35, #e74c3c);
      height: 100%;
      border-radius: 50px;
      width: 15%;
      animation: pulse 1.5s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }

    .stock-buyers {
      font-size: 12px;
      color: #888;
    }

    .stock-buyers strong {
      color: #ff6b35;
    }

    /* زر الشراء */
    .buy-button {
      background: linear-gradient(135deg, #ff6b35, #f7931e);
      color: white;
      border: none;
      border-radius: 50px;
      padding: 16px;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .buy-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(255,107,53,0.4);
    }

    .urgency {
      text-align: center;
      color: #e74c3c;
      font-size: 13px;
      margin-top: 12px;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="product-card">
    <div class="product-image">⌚</div>
    <div class="product-name">ساعة ذكية برو</div>
    <div class="product-price">
      <span>599 ريال</span>
      399 ريال
    </div>

    <div class="stock-widget">
      <div class="stock-header">
        <div class="stock-label">⚠️ مخزون محدود جداً!</div>
        <div class="stock-count">باقي <strong id="stock">3</strong> قطع</div>
      </div>
      <div class="stock-bar">
        <div class="stock-fill"></div>
      </div>
      <div class="stock-buyers">
        👥 <strong id="viewers">12</strong> شخص يشاهد هذا المنتج الآن
      </div>
    </div>

    <button class="buy-button">🛒 اشترِ الآن — قبل النفاد!</button>
    <div class="urgency" id="urgency">⚡ آخر 3 قطع — لا تفوّت الفرصة!</div>
  </div>

  <script>
    // تغيير عدد المشاهدين عشوائياً
    setInterval(() => {
      const viewers = Math.floor(Math.random() * 8) + 8;
      document.getElementById('viewers').textContent = viewers;
    }, 3000);

    // تغيير المخزون تدريجياً
    let stock = 3;
    setInterval(() => {
      if (stock > 1) {
        stock--;
        document.getElementById('stock').textContent = stock;
        document.getElementById('urgency').textContent = 
          `⚡ آخر ${stock} قطع — لا تفوّت الفرصة!`;
      }
    }, 15000);
  </script>

</body>
</html>
