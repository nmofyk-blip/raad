 <!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>رعد - زر واتساب</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', Arial, sans-serif; background: #f5f5f5; min-height: 100vh; }

    .whatsapp-btn {
      position: fixed;
      bottom: 24px;
      left: 24px;
      z-index: 9999;
    }

    .whatsapp-circle {
      width: 60px; height: 60px;
      background: #25D366;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      box-shadow: 0 8px 25px rgba(37,211,102,0.4);
      transition: transform 0.3s, box-shadow 0.3s;
      animation: pulse 2s ease infinite;
    }

    @keyframes pulse {
      0%,100% { box-shadow: 0 8px 25px rgba(37,211,102,0.4); }
      50% { box-shadow: 0 8px 40px rgba(37,211,102,0.7); }
    }

    .whatsapp-circle:hover {
      transform: scale(1.1);
      box-shadow: 0 12px 35px rgba(37,211,102,0.6);
    }

    .whatsapp-circle svg {
      width: 32px; height: 32px; fill: white;
    }

    .whatsapp-tooltip {
      position: absolute;
      bottom: 70px; left: 0;
      background: white;
      border-radius: 16px;
      padding: 16px;
      width: 260px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.15);
      display: none;
      animation: slideUp 0.3s ease;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .whatsapp-tooltip.show { display: block; }

    .tooltip-header {
      display: flex; align-items: center; gap: 10px;
      margin-bottom: 12px;
    }

    .tooltip-avatar {
      width: 40px; height: 40px;
      background: #25D366;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
    }

    .tooltip-name { font-weight: 700; font-size: 14px; color: #333; }
    .tooltip-status { font-size: 12px; color: #25D366; }

    .tooltip-message {
      background: #f0f0f0;
      border-radius: 12px 12px 12px 0;
      padding: 10px 14px;
      font-size: 13px;
      color: #555;
      margin-bottom: 12px;
      line-height: 1.5;
    }

    .tooltip-input {
      display: flex; gap: 8px;
    }

    .tooltip-input input {
      flex: 1; padding: 10px 14px;
      border: 1px solid #e0e0e0;
      border-radius: 50px; font-size: 13px;
    }

    .tooltip-input input:focus { outline: none; border-color: #25D366; }

    .send-btn {
      background: #25D366; color: white;
      border: none; border-radius: 50%;
      width: 38px; height: 38px;
      cursor: pointer; font-size: 16px;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.2s;
    }

    .send-btn:hover { background: #20ba5a; }

    .notification-badge {
      position: absolute;
      top: -4px; right: -4px;
      background: #ff6b35;
      color: white; font-size: 11px;
      font-weight: 700; width: 20px; height: 20px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      border: 2px solid white;
    }

    .page-demo {
      display: flex; align-items: center; justify-content: center;
      height: 100vh; text-align: center;
    }

    .demo-text { font-size: 20px; color: #888; }
  </style>
</head>
<body>

  <div class="page-demo">
    <div class="demo-text">💬 اضغط على زر واتساب في الزاوية</div>
  </div>

  <div class="whatsapp-btn">
    <div class="whatsapp-tooltip" id="tooltip">
      <div class="tooltip-header">
        <div class="tooltip-avatar">🛍️</div>
        <div>
          <div class="tooltip-name">خدمة العملاء</div>
          <div class="tooltip-status">● متصل الآن</div>
        </div>
      </div>
      <div class="tooltip-message">
        مرحباً! 👋 كيف يمكنني مساعدتك؟ نحن هنا للرد على جميع استفساراتك
      </div>
      <div class="tooltip-input">
        <input type="text" placeholder="اكتب رسالتك..." id="msgInput">
        <button class="send-btn" onclick="sendMsg()">➤</button>
      </div>
    </div>

    <div class="whatsapp-circle" onclick="toggleTooltip()">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/>
      </svg>
      <div class="notification-badge">1</div>
    </div>
  </div>

  <script>
    function toggleTooltip() {
      const tooltip = document.getElementById('tooltip');
      tooltip.classList.toggle('show');
      document.querySelector('.notification-badge').style.display = 'none';
    }

    function sendMsg() {
      const msg = document.getElementById('msgInput').value;
      if (!msg) return;
      const phone = '966510691019';
      window.open(`https://wa.me/${phone}?text=${encodeURIComponent(msg)}`, '_blank');
    }

    document.getElementById('msgInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sendMsg();
    });
  </script>

</body>
</html>
