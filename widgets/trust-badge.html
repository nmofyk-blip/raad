 <!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>رعد - بطاقة الضمان</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', Arial, sans-serif; background: #f5f5f5; padding: 40px 20px; }

    .trust-widget {
      max-width: 500px; margin: 0 auto;
      background: white; border-radius: 20px;
      padding: 24px; box-shadow: 0 8px 30px rgba(0,0,0,0.1);
    }

    .trust-title { font-size: 16px; font-weight: 700; color: #1a1a2e; margin-bottom: 16px; text-align: center; }

    .trust-grid {
      display: grid; grid-template-columns: repeat(2, 1fr);
      gap: 12px; margin-bottom: 16px;
    }

    .trust-item {
      background: #f8f8f8; border-radius: 16px;
      padding: 16px; text-align: center;
      border: 1px solid #f0f0f0; transition: all 0.2s;
    }

    .trust-item:hover { border-color: #ff6b35; background: #fff5f0; }

    .trust-icon { font-size: 32px; margin-bottom: 8px; }
    .trust-item-title { font-size: 13px; font-weight: 700; color: #333; margin-bottom: 4px; }
    .trust-item-text { font-size: 12px; color: #888; line-height: 1.4; }

    .trust-footer {
      background: linear-gradient(135deg, #1a1a2e, #16213e);
      border-radius: 16px; padding: 16px;
      display: flex; align-items: center;
      justify-content: center; gap: 12px;
    }

    .trust-footer-icon { font-size: 28px; }
    .trust-footer-text { color: white; font-size: 13px; line-height: 1.5; }
    .trust-footer-text strong { color: #ff6b35; }
  </style>
</head>
<body>
  <div class="trust-widget">
    <div class="trust-title">🔒 تسوق بأمان وثقة تامة</div>

    <div class="trust-grid">
      <div class="trust-item">
        <div class="trust-icon">🔄</div>
        <div class="trust-item-title">إرجاع مجاني</div>
        <div class="trust-item-text">خلال 30 يوم بدون أسئلة</div>
      </div>
      <div class="trust-item">
        <div class="trust-icon">🔐</div>
        <div class="trust-item-title">دفع آمن 100%</div>
        <div class="trust-item-text">تشفير SSL معتمد</div>
      </div>
      <div class="trust-item">
        <div class="trust-icon">🚚</div>
        <div class="trust-item-title">توصيل سريع</div>
        <div class="trust-item-text">خلال 2-4 أيام عمل</div>
      </div>
      <div class="trust-item">
        <div class="trust-icon">💬</div>
        <div class="trust-item-title">دعم 24/7</div>
        <div class="trust-item-text">فريق جاهز للمساعدة</div>
      </div>
    </div>

    <div class="trust-footer">
      <div class="trust-footer-icon">🛡️</div>
      <div class="trust-footer-text">
        <strong>ضمان استرداد المال</strong><br>
        غير راضٍ؟ نسترد أموالك كاملة خلال 30 يوم
      </div>
    </div>
  </div>
</body>
</html>
