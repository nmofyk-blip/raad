<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>رعد - إشعار المبيعات</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #f5f5f5;
      min-height: 100vh;
    }

    .raad-notification {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: white;
      border-radius: 16px;
      padding: 16px 20px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.15);
      display: flex;
      align-items: center;
      gap: 14px;
      max-width: 320px;
      border-right: 4px solid #ff6b35;
      transform: translateX(400px);
      opacity: 0;
      transition: all 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
      z-index: 9999;
    }

    .raad-notification.show {
      transform: translateX(0);
      opacity: 1;
    }

    .notif-avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ff6b35, #f7931e);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      flex-shrink: 0;
    }

    .notif-content {
      flex: 1;
    }

    .notif-name {
      font-weight: 700;
      color: #1a1a2e;
      font-size: 14px;
    }

    .notif-action {
      color: #666;
      font-size: 13px;
      margin-top: 2px;
    }

    .notif-action span {
      color: #ff6b35;
      font-weight: 600;
    }

    .notif-time {
      color: #aaa;
      font-size: 11px;
      margin-top: 4px;
    }

    .notif-close {
      position: absolute;
      top: 8px;
      left: 8px;
      background: none;
      border: none;
      color: #ccc;
      cursor: pointer;
      font-size: 16px;
      padding: 2px 6px;
    }

    .notif-close:hover {
      color: #999;
    }

    .verified {
      color: #4CAF50;
      font-size: 12px;
      margin-top: 2px;
    }
  </style>
</head>
<body>

  <div class="raad-notification" id="notification">
    <div class="notif-avatar" id="avatar">🛍️</div>
    <div class="notif-content">
      <div class="notif-name" id="name">أحمد من الرياض</div>
      <div class="notif-action">اشترى <span id="product">سماعات لاسلكية</span></div>
      <div class="notif-time" id="time">منذ 3 دقائق</div>
      <div class="verified">✓ تم التحقق</div>
    </div>
    <button class="notif-close" onclick="hideNotif()">✕</button>
  </div>

  <script>
    const sales = [
      { name: 'أحمد من الرياض', product: 'سماعات لاسلكية', time: 'منذ 3 دقائق', avatar: '🛍️' },
      { name: 'سارة من جدة', product: 'ساعة ذكية', time: 'منذ 7 دقائق', avatar: '⌚' },
      { name: 'محمد من الدمام', product: 'حقيبة جلدية', time: 'منذ 12 دقيقة', avatar: '👜' },
      { name: 'نورة من أبها', product: 'عطر فاخر', time: 'منذ دقيقتين', avatar: '🌸' },
      { name: 'خالد من مكة', product: 'جهاز لوحي', time: 'منذ 5 دقائق', avatar: '📱' },
    ];

    let index = 0;

    function showNotif() {
      const sale = sales[index % sales.length];
      
      document.getElementById('name').textContent = sale.name;
      document.getElementById('product').textContent = sale.product;
      document.getElementById('time').textContent = sale.time;
      document.getElementById('avatar').textContent = sale.avatar;

      const notif = document.getElementById('notification');
      notif.classList.add('show');

      setTimeout(() => {
        hideNotif();
      }, 4000);

      index++;
    }

    function hideNotif() {
      document.getElementById('notification').classList.remove('show');
      setTimeout(showNotif, 5000);
    }

    setTimeout(showNotif, 2000);
  </script>

</body>
</html>
