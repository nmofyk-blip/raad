 <!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>رعد - نافذة الترحيب</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #f5f5f5;
      min-height: 100vh;
    }

    .overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(4px);
      z-index: 9998;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .welcome-popup {
      background: white;
      border-radius: 24px;
      max-width: 480px;
      width: 90%;
      overflow: hidden;
      box-shadow: 0 30px 80px rgba(0,0,0,0.3);
      animation: popIn 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
    }

    @keyframes popIn {
      from { transform: scale(0.8); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .popup-header {
      background: linear-gradient(135deg, #1a1a2e, #16213e);
      padding: 32px;
      text-align: center;
      position: relative;
    }

    .popup-header .emoji {
      font-size: 56px;
      display: block;
      margin-bottom: 12px;
      animation: wave 1s ease infinite;
    }

    @keyframes wave {
      0%, 100% { transform: rotate(0deg); }
      25% { transform: rotate(20deg); }
      75% { transform: rotate(-20deg); }
    }

    .popup-header h2 {
      color: white;
      font-size: 24px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .popup-header p {
      color: rgba(255,255,255,0.6);
      font-size: 14px;
    }

    .close-btn {
      position: absolute;
      top: 16px;
      left: 16px;
      background: rgba(255,255,255,0.1);
      border: none;
      border-radius: 50%;
      width: 32px;
      height: 32px;
      color: white;
      cursor: pointer;
      font-size: 16px;
      transition: background 0.2s;
    }

    .close-btn:hover {
      background: rgba(255,255,255,0.2);
    }

    .popup-body {
      padding: 28px 32px;
    }

    .offer-highlight {
      background: linear-gradient(135deg, #fff5f0, #fff0e8);
      border: 2px solid #ffcdb0;
      border-radius: 16px;
      padding: 20px;
      text-align: center;
      margin-bottom: 24px;
    }

    .offer-highlight .discount {
      font-size: 48px;
      font-weight: 800;
      color: #ff6b35;
      line-height: 1;
    }

    .offer-highlight .discount-label {
      font-size: 14px;
      color: #888;
      margin-top: 4px;
    }

    .coupon-row {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    .coupon-input {
      flex: 1;
      padding: 12px 16px;
      border: 2px solid #ff6b35;
      border-radius: 50px;
      font-size: 16px;
      font-weight: 700;
      color: #ff6b35;
      text-align: center;
      background: white;
      letter-spacing: 2px;
    }

    .copy-btn {
      background: #ff6b35;
      color: white;
      border: none;
      border-radius: 50px;
      padding: 12px 20px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .copy-btn:hover {
      background: #f7931e;
    }

    .benefits {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 24px;
    }

    .benefit-item {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 14px;
      color: #555;
    }

    .benefit-icon {
      width: 32px;
      height: 32px;
      background: #fff5f0;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
    }

    .email-section {
      margin-bottom: 20px;
    }

    .email-input {
      width: 100%;
      padding: 14px 20px;
      border: 2px solid #e0e0e0;
      border-radius: 50px;
      font-size: 15px;
      margin-bottom: 12px;
      transition: border-color 0.2s;
      text-align: right;
    }

    .email-input:focus {
      outline: none;
      border-color: #ff6b35;
    }

    .subscribe-btn {
      background: linear-gradient(135deg, #ff6b35, #f7931e);
      color: white;
      border: none;
      border-radius: 50px;
      padding: 16px;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .subscribe-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(255,107,53,0.4);
    }

    .no-thanks {
      text-align: center;
      margin-top: 12px;
      font-size: 12px;
      color: #bbb;
      cursor: pointer;
      text-decoration: underline;
    }

    .no-thanks:hover { color: #999; }

    .timer-bar {
      height: 4px;
      background: #f0f0f0;
      border-radius: 0 0 24px 24px;
      overflow: hidden;
    }

    .timer-fill {
      height: 100%;
      background: linear-gradient(90deg, #ff6b35, #f7931e);
      border-radius: 2px;
      width: 100%;
      animation: shrink 30s linear forwards;
    }

    @keyframes shrink {
      from { width: 100%; }
      to { width: 0%; }
    }
  </style>
</head>
<body>

  <div class="overlay" id="overlay">
    <div class="welcome-popup">
      <div class="popup-header">
        <button class="close-btn" onclick="closePopup()">✕</button>
        <span class="emoji">👋</span>
        <h2>أهلاً وسهلاً بك!</h2>
        <p>اشترك الآن واحصل على عرض ترحيبي حصري</p>
      </div>

      <div class="popup-body">
        <div class="offer-highlight">
          <div class="discount">15%</div>
          <div class="discount-label">خصم على أول طلب لك</div>
          <div class="coupon-row">
            <input class="coupon-input" value="WELCOME15" readonly id="coupon">
            <button class="copy-btn" onclick="copyCoupon()">📋 نسخ</button>
          </div>
        </div>

        <div class="benefits">
          <div class="benefit-item">
            <div class="benefit-icon">🚚</div>
            توصيل مجاني على أول طلب
          </div>
          <div class="benefit-item">
            <div class="benefit-icon">⚡</div>
            عروض حصرية للمشتركين فقط
          </div>
          <div class="benefit-item">
            <div class="benefit-icon">🔔</div>
            إشعار فوري بأحدث العروض
          </div>
        </div>

        <div class="email-section">
          <input class="email-input" type="email" placeholder="أدخل بريدك الإلكتروني">
          <button class="subscribe-btn" onclick="subscribe()">
            🎁 احصل على الخصم الآن
          </button>
        </div>

        <div class="no-thanks" onclick="closePopup()">
          لا شكراً، سأتخلى عن الخصم
        </div>
      </div>

      <div class="timer-bar">
        <div class="timer-fill"></div>
      </div>
    </div>
  </div>

  <script>
    function closePopup() {
      document.getElementById('overlay').style.display = 'none';
    }

    function copyCoupon() {
      const code = document.getElementById('coupon').value;
      navigator.clipboard.writeText(code);
      event.target.textContent = '✅ تم النسخ';
      setTimeout(() => event.target.textContent = '📋 نسخ', 2000);
    }

    function subscribe() {
      const email = document.querySelector('.email-input').value;
      if (!email) {
        alert('أدخل بريدك الإلكتروني أولاً');
        return;
      }
      alert(`✅ تم التسجيل!\nكوبونك: WELCOME15\nسيصلك على: ${email}`);
      closePopup();
    }

    // إغلاق تلقائي بعد 30 ثانية
    setTimeout(closePopup, 30000);
  </script>

</body>
</html>
